<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaMotion</title>
  <style>
    /* reset & base */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body {
      background: #0b0f16;
      color: #e8edf5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* loading screen */
    #loading-screen {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: #0b0f16; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999;
      transition: opacity 1.2s ease;
    }
    #loading-screen.hide { opacity:0; pointer-events:none; }
    #loading-screen h1 {
      font-weight:300; letter-spacing:6px; color:#b0c4de;
      font-size:2.8rem; margin-bottom:20px; border-bottom:2px solid #1a2332; padding-bottom:12px;
    }
    .loader {
      width:48px; height:48px; border:4px solid #1a2332;
      border-top:4px solid #b0c4de; border-radius:50%; animation:spin 0.9s linear infinite;
    }
    @keyframes spin { 100% { transform:rotate(360deg); } }
    .loader-text { margin-top:18px; color:#5a6a82; font-size:0.9rem; letter-spacing:2px; }

    /* app layout */
    #app {
      display: none;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      background: #0b0f16;
    }
    #app.active { display: flex; }

    #main-row {
      display: flex;
      flex: 1;
      min-height: 0; /* prevent overflow */
    }

    /* left toolbar */
    #toolbar {
      width: 200px; min-width:200px;
      background: #1a2332;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 1px solid #2a3a4a;
      overflow-y: auto;
      height: 100%;
    }
    #toolbar h2 {
      font-size:1rem; font-weight:400; color:#b0c4de;
      letter-spacing:2px; border-bottom:1px solid #2a3a4a;
      padding-bottom:8px; margin-bottom:6px; text-align:center;
    }
    .btn {
      background: #0b0f16; border:1px solid #2a3a4a; color:#e8edf5;
      padding:8px 6px; font-size:0.8rem; cursor:pointer; border-radius:4px;
      transition:0.15s; text-align:center; letter-spacing:0.3px;
    }
    .btn:hover { background:#2a3a4a; border-color:#b0c4de; }
    .btn:active { background:#3a4a5a; }
    .btn-group { display:flex; flex-direction:column; gap:4px; margin-top:2px; }
    .btn-group label { font-size:0.65rem; color:#7a8aa2; text-transform:uppercase; letter-spacing:1px; margin-top:4px; }
    .separator { height:1px; background:#2a3a4a; margin:4px 0; }
    .flex-row { display:flex; gap:4px; flex-wrap:wrap; }
    .flex-row .btn { flex:1; min-width:40px; }

    /* canvas */
    #canvas-wrapper {
      flex: 1;
      background: #0b0f16;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      height: 100%;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      background: #111820;
      border: 1px solid #1a2332;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }
    #mainCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #111820;
      cursor: crosshair;
    }

    /* layer panel */
    #layer-panel {
      width: 170px; min-width:170px;
      background: #1a2332;
      border-left: 1px solid #2a3a4a;
      padding: 10px 8px;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #layer-panel h3 {
      font-size:0.75rem; font-weight:300; color:#7a8aa2;
      letter-spacing:2px; border-bottom:1px solid #2a3a4a;
      padding-bottom:6px; margin-bottom:6px; text-align:center;
    }
    .layer-item {
      background:#0b0f16; border:1px solid #2a3a4a; padding:4px 6px;
      font-size:0.7rem; border-radius:3px; display:flex;
      justify-content:space-between; align-items:center; color:#b0c4de;
      cursor:pointer; transition:0.1s;
    }
    .layer-item.active { border-color:#b0c4de; background:#1a2a3a; }
    .layer-item .layer-name { max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .layer-item .layer-del { color:#a05060; font-weight:bold; cursor:pointer; padding:0 4px; }
    .layer-item .layer-del:hover { color:#ff7a8a; }

    /* BOTTOM TIMELINE – CapCut style */
    #timeline-panel {
      height: 110px;
      min-height: 110px;
      background: #111820;
      border-top: 1px solid #2a3a4a;
      display: flex;
      flex-direction: column;
      padding: 6px 16px 8px 16px;
    }
    #timeline-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }
    #timeline-controls .btn {
      padding: 4px 12px;
      font-size: 0.8rem;
      background: #1a2332;
      border-color: #2a3a4a;
      border-radius: 4px;
      color: #b0c4de;
      cursor: pointer;
    }
    #timeline-controls .btn:hover { background: #2a3a4a; }
    #timeline-controls .btn.export-btn {
      background: #1a3a5a;
      border-color: #3a6a8a;
      color: #e0f0ff;
      font-weight: 500;
    }
    #timeline-controls .btn.export-btn:hover { background: #2a5a7a; }
    #time-display {
      font-size: 0.85rem;
      color: #b0c4de;
      font-variant-numeric: tabular-nums;
      min-width: 120px;
      letter-spacing: 0.5px;
    }
    #frame-counter {
      font-size: 0.7rem;
      color: #7a8aa2;
      margin-left: auto;
    }

    #timeline-track-container {
      position: relative;
      width: 100%;
      height: 40px;
      background: #0b0f16;
      border-radius: 4px;
      border: 1px solid #2a3a4a;
      cursor: pointer;
      overflow: visible;
      margin-top: 2px;
    }
    #timeline-track {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .timeline-marker {
      position: absolute;
      top: 2px;
      height: calc(100% - 4px);
      width: 2px;
      background: #4a6a8a;
      opacity: 0.4;
      pointer-events: none;
    }
    .timeline-marker.active-marker {
      background: #b0c4de;
      opacity: 0.8;
      width: 3px;
    }
    #playhead {
      position: absolute;
      top: -4px;
      left: 0;
      width: 10px;
      height: calc(100% + 8px);
      background: transparent;
      pointer-events: none;
      z-index: 5;
    }
    #playhead::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 3px;
      width: 2px;
      height: 100%;
      background: #ffaa66;
      box-shadow: 0 0 8px #ffaa66;
    }
    #playhead::before {
      content: '▲';
      position: absolute;
      top: -14px;
      left: -2px;
      color: #ffaa66;
      font-size: 12px;
      text-shadow: 0 0 6px #ffaa66;
    }
    #playhead.dragging { pointer-events: none; } /* we use separate drag handle */

    #playhead-drag-handle {
      position: absolute;
      top: 0;
      left: 0;
      width: 16px;
      height: 100%;
      cursor: ew-resize;
      z-index: 10;
      background: transparent;
      transform: translateX(-6px);
    }

    /* progress during export */
    #export-progress {
      display: none;
      font-size: 0.75rem;
      color: #b0c4de;
      margin-left: 8px;
    }
    #export-progress.active { display: inline-block; }

    @media (max-width: 900px) {
      #toolbar { width: 150px; min-width:150px; }
      #layer-panel { width: 130px; min-width:130px; }
      #timeline-panel { height: 90px; min-height:90px; }
      #timeline-track-container { height: 30px; }
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div id="loading-screen">
    <h1>MANGA MOTION</h1>
    <div class="loader"></div>
    <div class="loader-text">loading assets ...</div>
  </div>

  <!-- APP -->
  <div id="app">
    <div id="main-row">
      <!-- LEFT TOOLBAR (same as before) -->
      <div id="toolbar">
        <h2>⚡ tools</h2>
        <button class="btn" id="btnInsertImage">📷 insert image</button>
        <button class="btn" id="btnKeyframes">🎞️ keyframes</button>
        <div class="separator"></div>
        <div class="btn-group">
          <label>auto cut-out</label>
          <button class="btn" id="btnAutoCut">✂️ cut background</button>
        </div>
        <div class="btn-group">
          <label>auto refill</label>
          <button class="btn" id="btnAutoRefill">🔄 refill missing</button>
        </div>
        <div class="separator"></div>
        <div class="btn-group">
          <label>movement frames</label>
          <button class="btn" id="btnMoveFrames">↔️ tween</button>
        </div>
        <div class="btn-group">
          <label>body parts</label>
          <button class="btn" id="btnBodyParts">🧍 skeleton guide</button>
        </div>
        <div class="separator"></div>
        <div class="flex-row">
          <button class="btn" id="btnDroop">💧 droop</button>
          <button class="btn" id="btnUndo">↩️ undo</button>
        </div>
        <div style="margin-top:auto; font-size:0.55rem; color:#4a5a6a; text-align:center; padding-top:8px;">
          v1.0 · mangamotion
        </div>
      </div>

      <!-- CANVAS -->
      <div id="canvas-wrapper">
        <div id="canvas-container">
          <canvas id="mainCanvas" width="1600" height="900"></canvas>
        </div>
      </div>

      <!-- LAYER PANEL -->
      <div id="layer-panel">
        <h3>LAYERS</h3>
        <div id="layerList"></div>
        <div style="margin-top:6px; display:flex; gap:4px;">
          <button class="btn" id="btnAddLayer" style="flex:1;">+ add</button>
          <button class="btn" id="btnDelLayer" style="flex:1;">− del</button>
        </div>
        <div style="margin-top:4px;">
          <button class="btn" id="btnMergeDown" style="width:100%;">merge down</button>
        </div>
      </div>
    </div>

    <!-- BOTTOM TIMELINE – CapCut inspired -->
    <div id="timeline-panel">
      <div id="timeline-controls">
        <button class="btn" id="playBtn">▶ Play</button>
        <button class="btn export-btn" id="exportBtn">⬇ Export</button>
        <span id="time-display">00:00:00 / 00:00:00</span>
        <span id="frame-counter">0 / 0</span>
        <span id="export-progress">⏳ Exporting...</span>
      </div>
      <div id="timeline-track-container">
        <div id="timeline-track">
          <!-- markers will be inserted here -->
          <div id="playhead"><div id="playhead-drag-handle"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- core state ----------
      const canvas = document.getElementById('mainCanvas');
      const ctx = canvas.getContext('2d');
      const layerListEl = document.getElementById('layerList');
      const W = 1600, H = 900;

      let layers = [];                // each { name, data: ImageData, visible: bool }
      let currentLayerIndex = 0;
      let history = [];
      let isPlaying = false;
      let playInterval = null;
      let playbackMode = false;       // if true, only show the current frame (layer) – used for timeline scrub/play
      let frameRate = 24;
      let totalFrames = 0;            // = layers.length

      // timeline DOM
      const playBtn = document.getElementById('playBtn');
      const exportBtn = document.getElementById('exportBtn');
      const timeDisplay = document.getElementById('time-display');
      const frameCounter = document.getElementById('frame-counter');
      const trackContainer = document.getElementById('timeline-track-container');
      const track = document.getElementById('timeline-track');
      const playhead = document.getElementById('playhead');
      const dragHandle = document.getElementById('playhead-drag-handle');
      const exportProgress = document.getElementById('export-progress');

      // ---------- helpers ----------
      function cloneImageData(imgData) {
        if (!imgData) return null;
        const cloned = ctx.createImageData(imgData.width, imgData.height);
        cloned.data.set(imgData.data);
        return cloned;
      }
      function deepCopyLayers(arr) {
        return arr.map(l => ({
          name: l.name,
          visible: l.visible,
          data: cloneImageData(l.data)
        }));
      }
      function saveHistory() {
        history.push(deepCopyLayers(layers));
        if (history.length > 30) history.shift();
      }

      // ---------- rendering ----------
      function renderAll() {
        ctx.clearRect(0, 0, W, H);
        if (playbackMode) {
          // show only the current layer (as frame)
          const layer = layers[currentLayerIndex];
          if (layer && layer.data) {
            ctx.putImageData(layer.data, 0, 0);
          }
        } else {
          // normal composite all visible layers
          for (let i = 0; i < layers.length; i++) {
            const l = layers[i];
            if (l.visible && l.data) {
              ctx.putImageData(l.data, 0, 0);
            }
          }
        }
        updateTimelineMarkers();
        updatePlayheadPosition();
        updateTimeDisplay();
      }

      // render a specific frame (layer index) – for export/playback
      function renderFrame(index) {
        ctx.clearRect(0, 0, W, H);
        const layer = layers[index];
        if (layer && layer.data) {
          ctx.putImageData(layer.data, 0, 0);
        }
      }

      // ---------- timeline UI ----------
      function updateTimelineMarkers() {
        // remove old markers except playhead
        const markers = track.querySelectorAll('.timeline-marker');
        markers.forEach(m => m.remove());
        if (layers.length === 0) return;
        const count = layers.length;
        for (let i = 0; i < count; i++) {
          const marker = document.createElement('div');
          marker.className = 'timeline-marker' + (i === currentLayerIndex ? ' active-marker' : '');
          const left = (i / (count - 1)) * 100;
          marker.style.left = left + '%';
          track.appendChild(marker);
        }
      }

      function updatePlayheadPosition() {
        if (layers.length <= 1) {
          playhead.style.left = '0%';
          return;
        }
        const pos = (currentLayerIndex / (layers.length - 1)) * 100;
        playhead.style.left = pos + '%';
      }

      function updateTimeDisplay() {
        const total = layers.length;
        const current = Math.min(currentLayerIndex, total - 1);
        const totalSeconds = total / frameRate;
        const currentSeconds = current / frameRate;
        const fmt = (s) => {
          const hrs = Math.floor(s / 3600);
          const mins = Math.floor((s % 3600) / 60);
          const secs = Math.floor(s % 60);
          return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        };
        timeDisplay.textContent = `${fmt(currentSeconds)} / ${fmt(totalSeconds)}`;
        frameCounter.textContent = `${current+1} / ${total}`;
        totalFrames = total;
      }

      // ---------- timeline drag ----------
      let isDragging = false;
      dragHandle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        isDragging = true;
        document.body.style.cursor = 'ew-resize';
        if (isPlaying) stopPlayback();
      });
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = trackContainer.getBoundingClientRect();
        let x = (e.clientX - rect.left) / rect.width;
        x = Math.max(0, Math.min(1, x));
        const idx = Math.round(x * (layers.length - 1));
        if (idx !== currentLayerIndex && idx >= 0 && idx < layers.length) {
          currentLayerIndex = idx;
          playbackMode = true; // switch to frame view
          renderAll();
          updateLayerUI(); // highlight active
        }
      });
      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.cursor = 'default';
        }
      });

      // click on track to seek
      trackContainer.addEventListener('click', (e) => {
        if (isDragging) return;
        if (isPlaying) stopPlayback();
        const rect = trackContainer.getBoundingClientRect();
        let x = (e.clientX - rect.left) / rect.width;
        x = Math.max(0, Math.min(1, x));
        const idx = Math.round(x * (layers.length - 1));
        if (idx >= 0 && idx < layers.length) {
          currentLayerIndex = idx;
          playbackMode = true;
          renderAll();
          updateLayerUI();
        }
      });

      // ---------- play / stop ----------
      function startPlayback() {
        if (isPlaying) return;
        if (layers.length < 2) { alert('Need at least 2 layers (frames) to play.'); return; }
        isPlaying = true;
        playBtn.textContent = '⏹ Stop';
        playbackMode = true;
        // ensure current index is valid
        if (currentLayerIndex >= layers.length) currentLayerIndex = 0;
        renderAll();
        let frameIndex = currentLayerIndex;
        const total = layers.length;
        playInterval = setInterval(() => {
          frameIndex = (frameIndex + 1) % total;
          currentLayerIndex = frameIndex;
          renderAll();
          updateLayerUI();
        }, 1000 / frameRate);
      }

      function stopPlayback() {
        if (playInterval) {
          clearInterval(playInterval);
          playInterval = null;
        }
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        // stay in playbackMode
      }

      function togglePlay() {
        if (isPlaying) {
          stopPlayback();
        } else {
          startPlayback();
        }
      }
      playBtn.addEventListener('click', togglePlay);

      // ---------- export (CapCut style) ----------
      async function exportVideo() {
        if (layers.length < 2) { alert('Need at least 2 frames (layers) to export.'); return; }
        if (isPlaying) stopPlayback();

        exportProgress.classList.add('active');
        exportBtn.disabled = true;
        exportBtn.textContent = '⏳ Recording...';

        const totalFrames = layers.length;
        const duration = totalFrames / frameRate; // seconds

        // use canvas.captureStream
        const stream = canvas.captureStream(frameRate);
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        const chunks = [];

        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'mangamotion_export.webm';
          a.click();
          URL.revokeObjectURL(url);
          exportProgress.classList.remove('active');
          exportBtn.disabled = false;
          exportBtn.textContent = '⬇ Export';
        };

        // start recording
        recorder.start();

        // we will manually draw each frame at the right time
        // We'll use a timer to advance frames.
        let frameIndex = 0;
        const startTime = performance.now();

        return new Promise((resolve) => {
          function drawNextFrame() {
            if (frameIndex >= totalFrames) {
              recorder.stop();
              resolve();
              return;
            }
            // render current frame
            renderFrame(frameIndex);
            // update UI to show progress
            currentLayerIndex = frameIndex;
            updateTimeDisplay();
            updatePlayheadPosition();
            updateLayerUI();

            frameIndex++;
            // schedule next frame at 1/frameRate intervals
            const elapsed = (performance.now() - startTime) / 1000;
            const expectedTime = frameIndex / frameRate;
            const delay = Math.max(0, (expectedTime - elapsed) * 1000);
            setTimeout(drawNextFrame, delay);
          }

          // start drawing first frame immediately
          setTimeout(drawNextFrame, 0);
        });
      }

      exportBtn.addEventListener('click', exportVideo);

      // ---------- layer management ----------
      function addLayer(name) {
        saveHistory();
        const newData = ctx.createImageData(W, H);
        layers.push({ name: name || `Layer ${layers.length+1}`, data: newData, visible: true });
        currentLayerIndex = layers.length - 1;
        playbackMode = false; // exit frame-only mode
        updateLayerUI();
        renderAll();
      }

      function updateLayerUI() {
        layerListEl.innerHTML = '';
        layers.forEach((layer, idx) => {
          const div = document.createElement('div');
          div.className = 'layer-item' + (idx === currentLayerIndex ? ' active' : '');
          const nameSpan = document.createElement('span');
          nameSpan.className = 'layer-name';
          nameSpan.textContent = layer.name || `Layer ${idx+1}`;
          const visSpan = document.createElement('span');
          visSpan.textContent = layer.visible ? '👁' : '🚫';
          visSpan.style.cursor = 'pointer';
          visSpan.style.marginRight = '6px';
          visSpan.onclick = (e) => {
            e.stopPropagation();
            layers[idx].visible = !layers[idx].visible;
            updateLayerUI();
            renderAll();
          };
          const delSpan = document.createElement('span');
          delSpan.className = 'layer-del';
          delSpan.textContent = '✕';
          delSpan.onclick = (e) => {
            e.stopPropagation();
            if (layers.length <= 1) { alert('Cannot delete last layer.'); return; }
            saveHistory();
            layers.splice(idx, 1);
            if (currentLayerIndex >= layers.length) currentLayerIndex = layers.length - 1;
            if (currentLayerIndex === idx && idx === layers.length) currentLayerIndex--;
            updateLayerUI();
            renderAll();
          };
          div.appendChild(visSpan);
          div.appendChild(nameSpan);
          div.appendChild(delSpan);
          div.onclick = () => {
            currentLayerIndex = idx;
            playbackMode = true; // show single frame
            renderAll();
            updateLayerUI();
          };
          layerListEl.appendChild(div);
        });
        // update timeline markers and counters
        updateTimelineMarkers();
        updatePlayheadPosition();
        updateTimeDisplay();
      }

      function initLayers() {
        const blank = ctx.createImageData(W, H);
        layers = [{ name: 'Background', data: blank, visible: true }];
        currentLayerIndex = 0;
        playbackMode = false;
        updateLayerUI();
        renderAll();
      }

      // ---------- existing button actions (kept, with small mods) ----------
      document.getElementById('btnInsertImage').addEventListener('click', function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              saveHistory();
              const data = layers[currentLayerIndex].data;
              if (!data) return;
              const scaleX = W / img.width;
              const scaleY = H / img.height;
              const scale = Math.min(scaleX, scaleY, 1);
              const w = img.width * scale;
              const h = img.height * scale;
              const dx = (W - w)/2, dy = (H - h)/2;
              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = W; tempCanvas.height = H;
              const tCtx = tempCanvas.getContext('2d');
              tCtx.drawImage(img, dx, dy, w, h);
              const tempData = tCtx.getImageData(0, 0, W, H);
              const target = data.data;
              const src = tempData.data;
              for (let i = 0; i < target.length; i += 4) {
                const alphaSrc = src[i+3] / 255;
                if (alphaSrc === 0) continue;
                const alphaTgt = target[i+3] / 255;
                const outAlpha = alphaSrc + alphaTgt * (1 - alphaSrc);
                if (outAlpha === 0) continue;
                target[i] = (src[i] * alphaSrc + target[i] * alphaTgt * (1 - alphaSrc)) / outAlpha;
                target[i+1] = (src[i+1] * alphaSrc + target[i+1] * alphaTgt * (1 - alphaSrc)) / outAlpha;
                target[i+2] = (src[i+2] * alphaSrc + target[i+2] * alphaTgt * (1 - alphaSrc)) / outAlpha;
                target[i+3] = outAlpha * 255;
              }
              renderAll();
              updateLayerUI();
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        };
        input.click();
      });

      document.getElementById('btnKeyframes').addEventListener('click', function() {
        saveHistory();
        const composite = ctx.getImageData(0, 0, W, H);
        layers.push({
          name: `Keyframe ${layers.length}`,
          data: composite,
          visible: true
        });
        currentLayerIndex = layers.length - 1;
        playbackMode = true;
        updateLayerUI();
        renderAll();
      });

      document.getElementById('btnAutoCut').addEventListener('click', function() {
        const data = layers[currentLayerIndex].data;
        if (!data) return;
        saveHistory();
        const d = data.data;
        const bgR=17, bgG=24, bgB=32, threshold=40;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i+1], b = d[i+2];
          if (Math.abs(r-bgR) < threshold && Math.abs(g-bgG) < threshold && Math.abs(b-bgB) < threshold) {
            d[i+3] = 0;
          }
        }
        renderAll();
        updateLayerUI();
      });

      document.getElementById('btnAutoRefill').addEventListener('click', function() {
        const data = layers[currentLayerIndex].data;
        if (!data) return;
        saveHistory();
        const d = data.data;
        const copy = new Uint8ClampedArray(d);
        for (let y = 1; y < H-1; y++) {
          for (let x = 1; x < W-1; x++) {
            const idx = (y*W + x)*4;
            if (d[idx+3] === 0) {
              let sumR=0, sumG=0, sumB=0, count=0;
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx===0 && dy===0) continue;
                  const ni = ((y+dy)*W + (x+dx))*4;
                  if (copy[ni+3] > 0) {
                    sumR += copy[ni];
                    sumG += copy[ni+1];
                    sumB += copy[ni+2];
                    count++;
                  }
                }
              }
              if (count > 0) {
                d[idx] = sumR / count;
                d[idx+1] = sumG / count;
                d[idx+2] = sumB / count;
                d[idx+3] = 255;
              }
            }
          }
        }
        renderAll();
        updateLayerUI();
      });

      document.getElementById('btnMoveFrames').addEventListener('click', function() {
        saveHistory();
        const src = layers[currentLayerIndex].data;
        if (!src) return;
        const newData = ctx.createImageData(W, H);
        const srcD = src.data, dstD = newData.data;
        const shiftX = 20, shiftY = 10;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const sx = x - shiftX, sy = y - shiftY;
            if (sx < 0 || sx >= W || sy < 0 || sy >= H) continue;
            const si = (sy*W + sx)*4;
            const di = (y*W + x)*4;
            dstD[di] = srcD[si];
            dstD[di+1] = srcD[si+1];
            dstD[di+2] = srcD[si+2];
            dstD[di+3] = srcD[si+3];
          }
        }
        layers.push({
          name: `Tween ${layers.length}`,
          data: newData,
          visible: true
        });
        currentLayerIndex = layers.length - 1;
        playbackMode = true;
        updateLayerUI();
        renderAll();
      });

      document.getElementById('btnBodyParts').addEventListener('click', function() {
        saveHistory();
        const newData = ctx.createImageData(W, H);
        const d = newData.data;
        const cx = W/2, cy = H/2;
        const headR = 40, torsoLen = 120, armLen = 90, legLen = 110;
        for (let ang = 0; ang < 2*Math.PI; ang += 0.05) {
          const px = cx + headR * Math.cos(ang);
          const py = cy - 120 + headR * Math.sin(ang);
          if (px>=0 && px<W && py>=0 && py<H) {
            const idx = (Math.round(py)*W + Math.round(px))*4;
            d[idx]=255; d[idx+1]=255; d[idx+2]=255; d[idx+3]=255;
          }
        }
        for (let t=0; t<=1; t+=0.01) {
          const px = cx, py = cy-80 + t*torsoLen;
          if (px>=0 && px<W && py>=0 && py<H) {
            const idx = (Math.round(py)*W + Math.round(px))*4;
            d[idx]=255; d[idx+1]=255; d[idx+2]=255; d[idx+3]=255;
          }
        }
        for (let side = -1; side<=1; side+=2) {
          for (let t=0; t<=1; t+=0.01) {
            const px = cx + side*armLen*t;
            const py = cy-60 + 30*t;
            if (px>=0 && px<W && py>=0 && py<H) {
              const idx = (Math.round(py)*W + Math.round(px))*4;
              d[idx]=255; d[idx+1]=255; d[idx+2]=255; d[idx+3]=255;
            }
          }
        }
        for (let side = -1; side<=1; side+=2) {
          for (let t=0; t<=1; t+=0.01) {
            const px = cx + side*20*t;
            const py = cy + t*legLen;
            if (px>=0 && px<W && py>=0 && py<H) {
              const idx = (Math.round(py)*W + Math.round(px))*4;
              d[idx]=255; d[idx+1]=255; d[idx+2]=255; d[idx+3]=255;
            }
          }
        }
        layers.push({
          name: 'BodyGuide',
          data: newData,
          visible: true
        });
        currentLayerIndex = layers.length - 1;
        playbackMode = true;
        updateLayerUI();
        renderAll();
      });

      document.getElementById('btnDroop').addEventListener('click', function() {
        const data = layers[currentLayerIndex].data;
        if (!data) return;
        saveHistory();
        const d = data.data;
        const copy = new Uint8ClampedArray(d);
        const blurAmount = 8;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const idx = (y*W + x)*4;
            let sumR=0, sumG=0, sumB=0, sumA=0, count=0;
            for (let dy = -blurAmount; dy <= blurAmount; dy++) {
              const ny = y + dy;
              if (ny < 0 || ny >= H) continue;
              const ni = (ny*W + x)*4;
              if (copy[ni+3] > 0) {
                sumR += copy[ni];
                sumG += copy[ni+1];
                sumB += copy[ni+2];
                sumA += copy[ni+3];
                count++;
              }
            }
            if (count > 0) {
              d[idx] = sumR / count;
              d[idx+1] = sumG / count;
              d[idx+2] = sumB / count;
              d[idx+3] = sumA / count;
            }
          }
        }
        renderAll();
        updateLayerUI();
      });

      document.getElementById('btnUndo').addEventListener('click', function() {
        if (history.length > 0) {
          const last = history.pop();
          layers = deepCopyLayers(last);
          if (currentLayerIndex >= layers.length) currentLayerIndex = layers.length - 1;
          playbackMode = false;
          updateLayerUI();
          renderAll();
        } else {
          alert('Nothing to undo.');
        }
      });

      document.getElementById('btnAddLayer').addEventListener('click', function() {
        addLayer(`Layer ${layers.length+1}`);
      });

      document.getElementById('btnDelLayer').addEventListener('click', function() {
        if (layers.length <= 1) { alert('Cannot delete last layer.'); return; }
        saveHistory();
        layers.splice(currentLayerIndex, 1);
        if (currentLayerIndex >= layers.length) currentLayerIndex = layers.length - 1;
        playbackMode = false;
        updateLayerUI();
        renderAll();
      });

      document.getElementById('btnMergeDown').addEventListener('click', function() {
        if (currentLayerIndex <= 0) { alert('Already at bottom.'); return; }
        saveHistory();
        const below = layers[currentLayerIndex - 1];
        const current = layers[currentLayerIndex];
        if (!below.data || !current.data) return;
        const src = current.data.data;
        const dst = below.data.data;
        for (let i = 0; i < src.length; i += 4) {
          const aSrc = src[i+3] / 255;
          if (aSrc === 0) continue;
          const aDst = dst[i+3] / 255;
          const outA = aSrc + aDst * (1 - aSrc);
          if (outA === 0) continue;
          dst[i] = (src[i]*aSrc + dst[i]*aDst*(1-aSrc)) / outA;
          dst[i+1] = (src[i+1]*aSrc + dst[i+1]*aDst*(1-aSrc)) / outA;
          dst[i+2] = (src[i+2]*aSrc + dst[i+2]*aDst*(1-aSrc)) / outA;
          dst[i+3] = outA * 255;
        }
        layers.splice(currentLayerIndex, 1);
        currentLayerIndex = currentLayerIndex - 1;
        playbackMode = false;
        updateLayerUI();
        renderAll();
      });

      // ---------- drawing (keep as before) ----------
      let isDrawing = false;
      let lastX = 0, lastY = 0;
      let drawColor = '#ffffff';
      let drawSize = 6;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
        const x = (clientX - rect.left) * scaleX;
        const y = (clientY - rect.top) * scaleY;
        return { x: Math.min(Math.max(x, 0), W-1), y: Math.min(Math.max(y, 0), H-1) };
      }

      function startDraw(e) {
        e.preventDefault();
        const pos = getPos(e);
        isDrawing = true;
        lastX = pos.x; lastY = pos.y;
        saveHistory();
      }

      function draw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        const pos = getPos(e);
        const data = layers[currentLayerIndex].data;
        if (!data) return;
        const d = data.data;
        const radius = drawSize / 2;
        const cx = pos.x, cy = pos.y;
        const r = parseInt(drawColor.slice(1,3), 16);
        const g = parseInt(drawColor.slice(3,5), 16);
        const b = parseInt(drawColor.slice(5,7), 16);
        const steps = Math.max(Math.abs(pos.x - lastX), Math.abs(pos.y - lastY)) * 2;
        for (let t = 0; t <= 1; t += (steps > 0 ? 1/steps : 1)) {
          const x = lastX + (pos.x - lastX) * t;
          const y = lastY + (pos.y - lastY) * t;
          for (let dy = -radius; dy <= radius; dy++) {
            for (let dx = -radius; dx <= radius; dx++) {
              const dist = Math.sqrt(dx*dx + dy*dy);
              if (dist > radius) continue;
              const px = Math.round(x + dx);
              const py = Math.round(y + dy);
              if (px < 0 || px >= W || py < 0 || py >= H) continue;
              const idx = (py * W + px) * 4;
              const alpha = 255 * (1 - dist/radius);
              d[idx] = (d[idx] * (1-alpha/255) + r * (alpha/255));
              d[idx+1] = (d[idx+1] * (1-alpha/255) + g * (alpha/255));
              d[idx+2] = (d[idx+2] * (1-alpha/255) + b * (alpha/255));
              d[idx+3] = Math.min(255, d[idx+3] + alpha);
            }
          }
        }
        lastX = pos.x; lastY = pos.y;
        renderAll();
      }

      function endDraw(e) { isDrawing = false; }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endDraw);
      canvas.addEventListener('mouseleave', endDraw);
      canvas.addEventListener('touchstart', startDraw);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', endDraw);

      // ---------- init ----------
      setTimeout(function() {
        document.getElementById('loading-screen').classList.add('hide');
        document.getElementById('app').classList.add('active');
        initLayers();
        // set default draw color
        drawColor = '#ffffff';
        drawSize = 6;
        // initialize timeline
        updateTimelineMarkers();
        updatePlayheadPosition();
        updateTimeDisplay();
      }, 1500);

    })();
  </script>
</body>
</html>
